services:
  - type: web
    name: shipdev-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./shipdev.db
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: HUMAN_APPROVAL_SECRET
        value: human-gate-key-092dad4bd98666850024de1e1dc8ae95
      - key: API_SECRET_KEY
        value: agent-demo-key-570fb094501704f64ccf701c0e8d7c1d

