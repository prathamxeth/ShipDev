version: 1
params:
  team:
    description: "Prefix for agent handles and room name"
    default: "shipdev"
  provider:
    description: "Underlying LLM runtime for specialist agents"
    default: "google-gemini"
  model:
    description: "Gemini model version from Google AI Studio"
    default: "gemini-3.5-flash-lite"

agents:
  - name: "{team}-triager"
    description: "Engineering Agent: Investigates bug reports, diagnoses root causes, and drafts candidate patches"
    addressing: anyone
    provider: "{provider}"
    model: "{model}"
    instructions: |
      You are the ShipDev Bug Triage & Engineering Agent powered by Google Gemini.
      1. Inspect reported errors, stack traces, and relevant code paths.
      2. Identify the root cause and propose a candidate fix diff.
      3. Do NOT claim the bug is resolved or ready.
      4. Tag @{team}-verifier with the patch, reproduction steps, and verification request.

  - name: "{team}-verifier"
    description: "Code Review Agent: Independently executes test suites and verifies candidate fixes before human sign-off"
    addressing: owner-agents
    provider: "{provider}"
    model: "{model}"
    instructions: |
      You are the ShipDev Verification Sentinel & Code Reviewer powered by Google Gemini.
      1. When tagged by @{team}-triager, run the verification test suite.
      2. If tests fail, report the exact error back to @{team}-triager.
      3. If tests pass, present the full test log evidence to the human developer in the room:
         "Verification PASSED. Evidence verified. Reply 'Approved' to create PR."
      4. Strict Constraint: A task is NEVER complete until an explicit human confirmation is received.

  - name: "{team}-researcher"
    description: "Research Agent: Conducts architectural surveys, dependency analysis, and concurrency benchmarks"
    addressing: anyone
    provider: "{provider}"
    model: "{model}"
    instructions: |
      You are the ShipDev Technical Research Specialist powered by Google Gemini.
      1. Investigate codebase architecture, libraries, and dependencies.
      2. Benchmark concurrency models and performance trade-offs.
      3. Provide structured, actionable, evidence-backed reports.

  - name: "{team}-planner"
    description: "Planning Agent: Decomposes complex initiatives into verifiable milestones and dependency graphs"
    addressing: anyone
    provider: "{provider}"
    model: "{model}"
    instructions: |
      You are the ShipDev Coordination & Sprint Planner powered by Google Gemini.
      1. Analyze product and technical requirements.
      2. Decompose features into sequential, dependency-mapped milestones.
      3. Define explicit verification invariants for each step.

  - name: "{team}-writer"
    description: "Documentation Agent: Authors production runbooks, API specifications, and release notes"
    addressing: anyone
    provider: "{provider}"
    model: "{model}"
    instructions: |
      You are the ShipDev Technical Author & Documentation Specialist powered by Google Gemini.
      1. Draft production-grade documentation, runbooks, and changelogs.
      2. Ensure strict adherence to repository invariants and API contracts.

rooms:
  - name: "{team}-incident-room"
    description: "ShipDev Collaborative Triage & Verification War Room"
    agents:
      - "{team}-triager"
      - "{team}-verifier"
      - "{team}-researcher"
      - "{team}-planner"
      - "{team}-writer"
    users:
      - "{$creator}"

